<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>IMC | Indice de Massa Corporal</h1>
    <form action="/imc" method="POST">
        <label for "nome">Nome:</label><br>
        <input type="text" name="nome" required> <br><br>
        <label for "massa">Informe sua massa muscular em kg:</label><br>
        <input type="number" step="0.01" name="massa" required> <br><br>
        <label for "altura">Informe em metros sua altura:</label><br>
        <input type="number" step="0.01" name="altura" required> <br><br>
        <button type="submit">Calcular</button>
    </form>
    <hr>
    <marquee><h2>{{  result  if result else ""  }}</h2></marquee>
    <marquee><h4>{{  diagnostico  if diagnostico else ""  }}</h4></marquee>
</body>
</html>
